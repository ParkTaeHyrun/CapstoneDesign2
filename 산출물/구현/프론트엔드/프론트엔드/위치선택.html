<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>위치 선택</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="#">로그아웃</a>
            <a href="#">마이페이지</a>
        </nav>
    </header>
    <main>
        <h1>위치 선택</h1>
        <p>지진 예측을 진행할 위치를 입력하세요</p>
        <div class="input-group">
            <input type="text" placeholder="위치를 선택해주세요">
            <button>위치 찾기</button>
        </div>
        <div class="map-placeholder">
            사용자가 위치 찾기 버튼을 클릭하고 위치를 선택하면 위치가 지도화면으로 나옴
        </div>
        <button class="next-button">다음으로 넘어가기</button>
    </main>
</body>
</html>
