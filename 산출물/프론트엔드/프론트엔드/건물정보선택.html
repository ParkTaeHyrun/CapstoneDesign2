<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>건물정보 선택</title>
    <link rel="stylesheet" href="건물정보선택.css">
</head>
<body>
    <header>
        <nav>
            <a href="#">로그아웃</a>
            <a href="#">마이페이지</a>
        </nav>
    </header>
    <main>
        <h1>건물정보 선택</h1>
        <div class="selection-group">
            <div class="selection">
                <label for="area">면적</label>
                <select id="area">
                    <option>선택하세요</option>
                </select>
            </div>
            <div class="selection">
                <label for="floors">층수</label>
                <select id="floors">
                    <option>선택하세요</option>
                </select>
            </div>
            <div class="selection">
                <label for="usage">용도</label>
                <select id="usage">
                    <option>선택하세요</option>
                </select>
            </div>
        </div>
        <div class="button-group">
            <button class="result-button">뒤로가기</button>
            <button class="result-button">결과 보기</button>
        </div>
    </main>
</body>
</html>
